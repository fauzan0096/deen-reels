<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ویڈیوز — ورثة الانبياء</title>
<style>
  body { margin: 0; background: #0b1220; color: #e8d9a6;
    font-family: -apple-system, "Noto Naskh Arabic", sans-serif; }
  header { padding: 26px 16px 6px; text-align: center; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p { margin: 0; font-size: 13px; opacity: .75; text-align: center; }
  main { max-width: 460px; margin: 0 auto; padding: 16px 14px 48px; }
  .card { background: #111c31; border-radius: 16px; padding: 12px;
    margin-bottom: 22px; }
  h2 { font-size: 15px; margin: 0 0 8px; }
  video { width: 100%; border-radius: 12px; background: #000; }
  a { color: #e8d9a6; font-size: 13px; }
  .empty { padding: 30px 10px; font-size: 14px; opacity: .8; }
</style>
</head>
<body>
<header>
  <h1>ویڈیوز</h1>
  <p>ورثة الانبياء — بغیر ڈاؤن لوڈ، یہیں چلا کر دیکھیں</p>
</header>
<main id="list">
  <p class="empty">لوڈ ہو رہی ہیں…</p>
</main>
<script>
  const REPO = "fauzan0096/deen-reels";
  const TREE = `https://api.github.com/repos/${REPO}/git/trees/gh-pages?recursive=1`;
  const RAW = `https://raw.githubusercontent.com/${REPO}/gh-pages/`;

  function pretty(path) {
    const name = path.split("/").filter(Boolean).slice(-2, -1)[0] || path;
    return name.replace(/-/g, " ");
  }

  function card(path) {
    const wrap = document.createElement("section");
    wrap.className = "card";
    const h = document.createElement("h2");
    h.textContent = pretty(path);
    const v = document.createElement("video");
    v.controls = true;
    v.playsInline = true;
    v.setAttribute("webkit-playsinline", "");
    v.preload = "metadata";
    v.src = RAW + path;
    const link = document.createElement("a");
    link.href = RAW + path;
    link.textContent = "نئی ونڈو میں کھولیں";
    link.target = "_blank";
    wrap.append(h, v, link);
    return wrap;
  }

  async function load() {
    const list = document.getElementById("list");
    list.innerHTML = "";
    const found = [];

    try {
      const res = await fetch(TREE);
      const data = await res.json();
      for (const item of data.tree || []) {
        if (item.type === "blob" && /^all\/[^/]+\/video\.mp4$/.test(item.path)) {
          found.push(item.path);
        }
      }
    } catch (err) {
      /* neeche fallback */
    }

    found.sort();
    if (found.length) {
      found.forEach(path => list.append(card(path)));
      return;
    }

    // Abhi gallery nahi bani — kam az kam aakhri video.
    try {
      const res = await fetch(`https://api.github.com/repos/${REPO}/git/trees/gh-pages`);
      const data = await res.json();
      if ((data.tree || []).some(item => item.path === "video.mp4")) {
        list.append(card("video.mp4"));
        return;
      }
    } catch (err) {
      /* ignore */
    }

    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "ابھی کوئی ویڈیو نہیں ملی — Render all episodes چلائیے۔";
    list.append(p);
  }

  load();
</script>
</body>
</html>
