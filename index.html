<!doctype html>
<html lang="ur">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>نيا ویڈیو — ورثة الانبياء</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b1220; color: #e8d9a6;
      font-family: -apple-system, "Noto Naskh Arabic", sans-serif; }
    .wrap { display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 100%; padding: 16px; gap: 14px; }
    video { width: 100%; max-width: 420px; border-radius: 14px; background: #000; }
    a { color: #e8d9a6; font-size: 16px; }
    p { margin: 0; font-size: 15px; opacity: .8; text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <video id="v" controls playsinline preload="metadata" src="video.mp4"></video>
    <p>یہ سب سے نئی بنائی گئی ویڈیو ہے — روزانہ یہاں بدل جاتی ہے۔</p>
    <a href="video.mp4" download>ڈاؤن لوڈ کریں</a>
  </div>
  <script>
    // Har baar naya video aaye, browser cache purana na dikhaye.
    fetch('video.mp4', { method: 'HEAD' })
      .then(r => {
        const stamp = r.headers.get('last-modified') || Date.now();
        document.getElementById('v').src = 'video.mp4?t=' + encodeURIComponent(stamp);
      })
      .catch(() => {});
  </script>
</body>
</html>
