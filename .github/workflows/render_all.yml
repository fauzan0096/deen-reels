name: Render all episodes

# Sab videos ek saath banao (Abu Bakr + Umar, jitne bhi stories.json me hain),
# gallery page banao, aur har hissa alag download link ke saath release me daal do.
# Kuch bhi YouTube/Facebook par post nahi hota.
# Gallery har hisse ke baad update hoti hai — beech me ruk jaye to bhi jo ban
# chuke hain wo dekh/download kiye ja sakte hain.

on:
  workflow_dispatch:
  # Ye file badalne par ek dafa khud chal jata hai.
  push:
    paths:
      - ".github/workflows/render_all.yml"

concurrency:
  group: gh-pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Render every story
        env:
          CHANNEL_NAME: ${{ vars.CHANNEL_NAME || 'ورثة الانبياء' }}
          VIDEO_LANG: ${{ vars.VIDEO_LANG || 'ur' }}
          DRY_RUN: "yes"
        run: |
          set +e
          python -m video_factory.batch
          status=$?
          echo "batch exit: $status"
          # Kuch videos ban gayi hon to aage badhne do.
          if [ -f out/all/index.html ]; then
            exit 0
          fi
          exit $status

      - name: Upload all videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-reels
          path: out/all
          if-no-files-found: warn
          retention-days: 14

      - name: Publish direct download links (GitHub release)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -d out/all ]; then
            echo "Kuch nahi bana — release skip."
            exit 0
          fi
          rm -rf release_assets
          mkdir release_assets
          for f in out/all/*/video.mp4; do
            [ -f "$f" ] || continue
            name=$(basename "$(dirname "$f")")
            cp "$f" "release_assets/$name.mp4"
          done
          ls -1 release_assets || true
          gh release view parts >/dev/null 2>&1 || \
            gh release create parts \
              --title "Saare hisse" \
              --notes "Har hissa alag file — dekhne aur download karne ke liye." \
            || true
          if ls release_assets/*.mp4 >/dev/null 2>&1; then
            gh release upload parts release_assets/*.mp4 --clobber || \
              echo "Release upload skip."
          fi

      - name: Publish the gallery to GitHub Pages
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f out/all/index.html ]; then
            echo "Koi video nahi bani — publish skip."
            exit 0
          fi
          rm -rf site
          if ! git clone --depth 1 --branch gh-pages \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site 2>/dev/null; then
            rm -rf site
            mkdir site
            git -C site init -q
            git -C site checkout -q -b gh-pages
            git -C site remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          rm -rf site/all
          cp -r out/all site/all
          git -C site add -A
          git -C site -c user.name="deen-reels-bot" \
              -c user.email="actions@users.noreply.github.com" \
              commit -qm "all episodes" || true
          git -C site push -q origin HEAD:gh-pages || echo "gh-pages push skip."
