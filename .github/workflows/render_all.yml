name: Render all episodes

# Sab videos ek saath banao (Abu Bakr + Umar, jitne bhi stories.json me hain),
# gallery page banao, aur har hissa alag download link ke saath release me daal do.
# Kuch bhi YouTube/Facebook par post nahi hota.
# Gallery har hisse ke baad update hoti hai — beech me ruk jaye to bhi jo ban
# chuke hain wo dekh/download kiye ja sakte hain.
# Gallery gh-pages par jati hai; site ka player wahi videos chalata hai.

on:
  workflow_dispatch:

concurrency:
  group: gh-pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Render every story
        env:
          CHANNEL_NAME: ${{ vars.CHANNEL_NAME || 'ورثة الانبياء' }}
          VIDEO_LANG: ${{ vars.VIDEO_LANG || 'ur' }}
          VOICE: ${{ vars.VOICE }}
          DRY_RUN: "yes"
        run: |
          set +e
          python -m video_factory.batch
          status=$?
          echo "batch exit: $status"
          # Kuch videos ban gayi hon to aage badhne do.
          if [ -f out/all/index.html ]; then
            exit 0
          fi
          exit $status

      - name: Upload all videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-reels
          path: out/all
          if-no-files-found: warn
          retention-days: 3
